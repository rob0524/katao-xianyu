[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katao-xianyu"
version = "0.1.0"
description = "CardHobby wins to Xianyu via Goofish API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "goofish-api>=0.0.6",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.26.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
katao-xianyu = "katao_xianyu.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
